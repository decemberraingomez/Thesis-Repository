@if (open()) {
  <div class="dialog-backdrop" role="presentation" (click)="onBackdropClick($event)">
    <section
      class="dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="change-password-title"
      aria-describedby="change-password-description"
    >
      <h2 class="dialog__title" id="change-password-title">Change admin password</h2>
      <p class="dialog__message" id="change-password-description">
        Update the MongoDB-stored administrator password. The new password must be at least
        8 characters.
      </p>

      @if (errorMessage()) {
        <div class="alert alert--error" role="alert">{{ errorMessage() }}</div>
      }

      @if (successMessage()) {
        <div class="alert alert--success" role="status">{{ successMessage() }}</div>
      }

      <form class="form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <label class="field">
          <span class="field__label">Current password</span>
          <input
            class="input"
            type="password"
            formControlName="currentPassword"
            autocomplete="current-password"
            [class.input--invalid]="showError(form.controls.currentPassword, 'required')"
          />
          @if (showError(form.controls.currentPassword, 'required')) {
            <span class="field__error">Current password is required.</span>
          }
        </label>

        <label class="field">
          <span class="field__label">New password</span>
          <input
            class="input"
            type="password"
            formControlName="newPassword"
            autocomplete="new-password"
            [class.input--invalid]="showError(form.controls.newPassword, 'required') || showError(form.controls.newPassword, 'minlength')"
          />
          @if (showError(form.controls.newPassword, 'required')) {
            <span class="field__error">New password is required.</span>
          }
          @if (showError(form.controls.newPassword, 'minlength')) {
            <span class="field__error">Password must be at least 8 characters.</span>
          }
        </label>

        <label class="field">
          <span class="field__label">Confirm new password</span>
          <input
            class="input"
            type="password"
            formControlName="confirmPassword"
            autocomplete="new-password"
            [class.input--invalid]="showError(form.controls.confirmPassword, 'required')"
          />
          @if (showError(form.controls.confirmPassword, 'required')) {
            <span class="field__error">Confirm the new password.</span>
          }
        </label>

        <div class="dialog__actions">
          <button type="button" class="btn btn--ghost dialog__button" [disabled]="submitting()" (click)="close()">
            Cancel
          </button>
          <button type="submit" class="btn dialog__button" [disabled]="submitting()">
            @if (submitting()) {
              Updating...
            } @else {
              Change password
            }
          </button>
        </div>
      </form>
    </section>
  </div>
}
