<header class="site-header">
  <div class="container site-header__inner">
    <a routerLink="/home" class="brand" (click)="closeMenu()">Thesis Repository</a>

    <button
      type="button"
      class="menu-toggle"
      [class.menu-toggle--open]="menuOpen()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="primary-navigation"
      aria-label="Toggle navigation"
      (click)="toggleMenu()"
    >
      <span class="menu-toggle__bar"></span>
      <span class="menu-toggle__bar"></span>
      <span class="menu-toggle__bar"></span>
    </button>

    <nav
      id="primary-navigation"
      class="nav"
      [class.nav--open]="menuOpen()"
      aria-label="Primary"
    >
      <a
        routerLink="/home"
        routerLinkActive="nav__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav__link"
        (click)="closeMenu()"
      >
        Home
      </a>
      <a
        routerLink="/theses"
        routerLinkActive="nav__link--active"
        class="nav__link"
        (click)="closeMenu()"
      >
        Browse
      </a>

      @if (authService.isAdmin()) {
        <span class="role-badge" role="status">Admin</span>
        <a
          routerLink="/theses/new"
          routerLinkActive="nav__link--active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav__link nav__link--add"
          (click)="closeMenu()"
        >
          + Add thesis
        </a>
        <span class="nav__user">{{ authService.currentUser()?.name }}</span>
        <button type="button" class="nav__link nav__action" (click)="openPasswordDialog()">
          Change password
        </button>
        <button type="button" class="btn btn--ghost nav__cta" (click)="logout()">Logout</button>
      } @else {
        <a
          routerLink="/login"
          routerLinkActive="nav__link--active"
          class="btn btn--ghost nav__cta"
          (click)="closeMenu()"
        >
          Admin Login
        </a>
      }
    </nav>

    <button
      type="button"
      class="theme-toggle"
      (click)="toggleTheme()"
      [attr.aria-label]="themeService.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
      [attr.aria-pressed]="themeService.theme() === 'dark'"
      title="Toggle colour theme"
    >
      @if (themeService.theme() === 'dark') {
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" />
        </svg>
      } @else {
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
        </svg>
      }
    </button>
  </div>

  @if (authService.sessionNotice(); as notice) {
    <div class="container notice">
      <div class="alert alert--error" role="alert">
        <span>{{ notice }}</span>
        <button type="button" class="alert__dismiss" (click)="dismissNotice()">Dismiss</button>
      </div>
    </div>
  }
</header>

<app-change-password [open]="passwordDialogOpen()" (closed)="closePasswordDialog()" />
