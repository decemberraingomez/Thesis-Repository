<header class="site-header">
  <div class="container site-header__inner">
    <a routerLink="/home" class="brand">Thesis Repository</a>

    <nav class="nav" aria-label="Primary">
      <a
        routerLink="/home"
        routerLinkActive="nav__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav__link"
      >
        Home
      </a>
      <a routerLink="/theses" routerLinkActive="nav__link--active" class="nav__link">
        Browse
      </a>
      <a
        routerLink="/theses/new"
        routerLinkActive="nav__link--active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav__link"
      >
        Add thesis
      </a>
      <a routerLink="/login" routerLinkActive="nav__link--active" class="btn btn--ghost nav__cta">
        Admin login
      </a>
    </nav>
  </div>
</header>
