<main class="auth">
  <div class="auth__inner">
    <a routerLink="/home" class="brand">Thesis Repository</a>

    <div class="card">
      <h1 class="card__title">Administrator sign in</h1>
      <p class="card__text">Manage records, uploads, and moderation.</p>

      @if (errorMessage()) {
        <div class="alert alert--error" role="alert">{{ errorMessage() }}</div>
      }

      <form class="form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <label class="field">
          <span class="field__label">Email</span>
          <input
            class="input"
            type="email"
            formControlName="email"
            placeholder="admin@example.edu"
            autocomplete="username"
            [class.input--invalid]="showError(form.controls.email, 'required') || showError(form.controls.email, 'email')"
          />
          @if (showError(form.controls.email, 'required')) {
            <span class="field__error">Email is required.</span>
          }
          @if (showError(form.controls.email, 'email')) {
            <span class="field__error">Enter a valid email address.</span>
          }
        </label>

        <label class="field">
          <span class="field__label">Password</span>
          <input
            class="input"
            type="password"
            formControlName="password"
            placeholder="Enter your admin password"
            autocomplete="current-password"
            [class.input--invalid]="showError(form.controls.password, 'required') || showError(form.controls.password, 'minlength')"
          />
          @if (showError(form.controls.password, 'required')) {
            <span class="field__error">Password is required.</span>
          }
          @if (showError(form.controls.password, 'minlength')) {
            <span class="field__error">Password must be at least 6 characters.</span>
          }
        </label>

        <div class="form__row">
          <label class="checkbox">
            <input type="checkbox" formControlName="remember" />
            Remember me
          </label>
        </div>

        <button class="btn form__submit" type="submit" [disabled]="submitting()">
          @if (submitting()) {
            Signing in...
          } @else {
            Sign in
          }
        </button>
      </form>
    </div>

    <p class="auth__back">
      <a routerLink="/home" class="auth__back-link">← Back to site</a>
    </p>
  </div>
</main>
